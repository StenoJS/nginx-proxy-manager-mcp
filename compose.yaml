services:
  npm-mcp:
    build: .
    image: npm-mcp:latest
    container_name: npm-mcp
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      NPM_API_URL: ${NPM_API_URL}
      NPM_IDENTITY: ${NPM_IDENTITY}
      NPM_SECRET: ${NPM_SECRET}
      NPM_MCP_TRANSPORT: http
      NPM_MCP_HOST: 0.0.0.0
      NPM_MCP_PORT: "8000"
      NPM_MCP_ENABLE_DESTRUCTIVE_TOOLS: "true"
      NPM_MCP_AUTH_TOKEN: ${NPM_MCP_AUTH_TOKEN}
    networks:
      - hassio
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/mcp', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  hassio:
    external: true
